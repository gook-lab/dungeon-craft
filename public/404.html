<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0b16" />
    <title>길을 잃었어요 · 드래곤 크립트</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0b16;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        color: #f3edda;
        font-family:
          system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        background:
          linear-gradient(
            180deg,
            rgba(10, 11, 22, 0.78) 0%,
            rgba(10, 11, 22, 0.55) 45%,
            rgba(10, 11, 22, 0.92) 100%
          ),
          url("/key-art.webp") 47% 58% / cover no-repeat,
          #0a0b16;
      }
      main {
        width: min(440px, 100%);
        padding: 28px 24px 26px;
        text-align: center;
        background: rgba(18, 21, 46, 0.9);
        border: 3px solid #f3edda;
        box-shadow:
          inset 0 0 0 3px #12152e,
          inset 0 0 0 5px #39406e,
          0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .code {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.3em;
        color: #c98b2c;
      }
      h1 {
        margin: 8px 0 12px;
        font-size: 28px;
        color: #ffd766;
        text-shadow: 0 2px 0 #05060f;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: #a7b0d8;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 11px 22px;
        font-weight: 700;
        color: #0a0b16;
        background: #ffd766;
        text-decoration: none;
      }
      a:hover {
        background: #fff0b8;
      }
      a:focus-visible {
        outline: 2px solid #fff0b8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>길을 잃었어요</h1>
      <p>
        찾는 페이지가 크립트 깊은 곳으로 사라졌어요.<br />처음 화면에서 다시
        모험을 이어 가요.
      </p>
      <a href="/">처음 화면으로</a>
    </main>
  </body>
</html>
